<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phoenix Electronics</title>
  <style>
    :root { --brand:#e4572e; --ink:#1d1d1f; --muted:#6e6e73; --bg:#f5f5f7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--ink); color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { margin:0; font-size:20px; } header h1 span { color:var(--brand); }
    #env { font-size:12px; padding:4px 10px; border-radius:999px; background:var(--brand); }
    main { max-width:1100px; margin:24px auto; padding:0 16px; display:grid; grid-template-columns:1fr 300px; gap:24px; }
    .filters button { border:1px solid #ccc; background:#fff; border-radius:999px; padding:6px 14px; margin:0 6px 12px 0; cursor:pointer; }
    .filters button.active { background:var(--ink); color:#fff; border-color:var(--ink); }
    #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
    .card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .card .cat { color:var(--muted); font-size:12px; text-transform:uppercase; }
    .card h3 { font-size:16px; margin:6px 0 10px; }
    .card .price { font-weight:700; margin-bottom:12px; }
    .card button, #checkout { width:100%; background:var(--brand); color:#fff; border:0; border-radius:8px; padding:10px; cursor:pointer; font-weight:600; }
    aside { background:#fff; border-radius:12px; padding:16px; height:fit-content; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    aside li { display:flex; justify-content:space-between; font-size:14px; margin:6px 0; }
    aside ul { padding:0; list-style:none; }
    #error { color:#b00020; }
    footer { text-align:center; color:var(--muted); font-size:12px; padding:24px; }
    @media (max-width:760px){ main { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1><span>Phoenix</span> Electronics</h1>
    <div id="env">loading…</div>
  </header>
  <main>
    <section>
      <div class="filters" id="filters"></div>
      <p id="error"></p>
      <div id="grid"></div>
    </section>
    <aside>
      <h2>Your cart</h2>
      <ul id="cart"></ul>
      <p><strong>Total: ₹<span id="total">0</span></strong></p>
      <button id="checkout" disabled>Checkout (coming in Sprint 2)</button>
    </aside>
  </main>
  <footer>Built by the DataQuaint team · deployed by Argo CD · <span id="versions"></span></footer>
  <script src="app.js"></script>
</body>
</html>
