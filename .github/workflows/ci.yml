# Phoenix CI  (Day 7 + Day 8)
# test -> build -> Trivy scan -> push to GHCR (immutable tag + digest) -> PR to phoenix-gitops
#
# Required repo secret:  GITOPS_TOKEN  = fine-grained PAT with Contents + Pull requests
#                                        (read/write) on <org>/phoenix-gitops
# Optional repo variables: GITOPS_REPO (default: <owner>/phoenix-gitops)
#                          TRIVY_EXIT_CODE (default 1 = block on fixable CRITICAL)
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v tests

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    outputs:
      backend_ref: ${{ steps.ref.outputs.backend_ref }}
      frontend_ref: ${{ steps.ref.outputs.frontend_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and immutable tag
        id: meta
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=$REGISTRY/$owner/phoenix-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image (loaded locally for scanning)
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.tag }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
            -f ${{ matrix.dockerfile }} ${{ matrix.context }}

      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          # repo variable TRIVY_EXIT_CODE=0 turns the gate into report-only (emergency use)
          exit-code: ${{ vars.TRIVY_EXIT_CODE || '1' }}
          format: table

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and capture digest
        if: github.event_name != 'pull_request'
        id: push
        run: |
          ref=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          docker push "$ref"
          # convenience tag for first-time bootstrap only; GitOps always pins sha-...@sha256
          docker tag "$ref" ${{ steps.meta.outputs.image }}:latest && docker push ${{ steps.meta.outputs.image }}:latest
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.component }}: \`$ref@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Export reference
        if: github.event_name != 'pull_request'
        id: ref
        run: echo "${{ matrix.component }}_ref=${{ steps.meta.outputs.tag }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  update-gitops:
    # Only real merges to main produce a deployment change. It is a PR, so a human approves it.
    if: github.event_name != 'pull_request'
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out phoenix-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO || format('{0}/phoenix-gitops', github.repository_owner) }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Bump dev image references (Helm values + Kustomize overlay)
        env:
          BACKEND: ${{ needs.build-scan-push.outputs.backend_ref }}
          FRONTEND: ${{ needs.build-scan-push.outputs.frontend_ref }}
        run: |
          yq -i ".backend.image.tag = strenv(BACKEND) | .frontend.image.tag = strenv(FRONTEND)" helm/phoenix/values-dev.yaml
          # Kustomize track (Day 5) keeps the plain sha tag
          yq -i "(.images[] | select(.name == \"*phoenix-backend\") ).newTag = \"${BACKEND%@*}\"" environments/dev/kustomization.yaml
          yq -i "(.images[] | select(.name == \"*phoenix-frontend\") ).newTag = \"${FRONTEND%@*}\"" environments/dev/kustomization.yaml
          git diff

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          branch="deploy/dev-${GITHUB_SHA::7}"
          git config user.name "phoenix-ci"
          git config user.email "phoenix-ci@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "deploy(dev): phoenix ${GITHUB_SHA::7}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "deploy(dev): phoenix ${GITHUB_SHA::7}" \
            --body "Automated by phoenix-app CI run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          - backend: \`${{ needs.build-scan-push.outputs.backend_ref }}\`
          - frontend: \`${{ needs.build-scan-push.outputs.frontend_ref }}\`
          - source commit: ${{ github.sha }}

          Tests passed and Trivy found no fixable CRITICAL issues. Merge to deploy to **dev**." \
            --label deploy-dev || gh pr create --base main --head "$branch" --title "deploy(dev): phoenix ${GITHUB_SHA::7}" --body "Automated deployment PR from phoenix-app CI."
